<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="0.5">
    AI-POWERED PERSONAL DIET PLANNER — CLOUD ARCHITECTURE
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">
    End-to-End Stateless Cloud-Native System with Object Storage &amp; Multi-Tier Isolation
  </text>

  <!-- Boundaries / VPC -->
  <rect x="230" y="100" width="740" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" stroke-dasharray="6,4" />
  <text x="250" y="125" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">CLOUD ENVIRONMENT (AWS / GCP / RENDER PAAS)</text>

  <!-- 1. Client / Frontend Tier -->
  <g transform="translate(30, 200)">
    <rect width="160" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
    <rect width="160" height="36" rx="12" fill="url(#blueGrad)" />
    <text x="80" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Client / CDN Tier</text>
    <circle cx="80" cy="75" r="22" fill="#3b82f6" opacity="0.2" />
    <text x="80" y="81" text-anchor="middle" fill="#60a5fa" font-size="18">🌐</text>
    <text x="80" y="115" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">React + Vite SPA</text>
    <text x="80" y="134" text-anchor="middle" fill="#94a3b8" font-size="11">Tailwind CSS</text>
    <text x="80" y="152" text-anchor="middle" fill="#94a3b8" font-size="10">Cloudflare Pages / Vercel</text>
  </g>

  <!-- 2. API Gateway & Containerized Backend -->
  <g transform="translate(260, 160)">
    <rect width="210" height="260" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <rect width="210" height="36" rx="12" fill="url(#primaryGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Stateless Backend PaaS</text>
    
    <rect x="15" y="55" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="105" y="74" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">FastAPI REST Gateway</text>
    <text x="105" y="88" text-anchor="middle" fill="#94a3b8" font-size="10">Uvicorn ASGI • Async Workers</text>

    <rect x="15" y="108" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="105" y="127" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Stateless JWT Auth</text>
    <text x="105" y="141" text-anchor="middle" fill="#94a3b8" font-size="10">Bcrypt • RBAC • Multi-Tenant</text>

    <rect x="15" y="161" width="180" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="105" y="180" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">Presigned URL Signer</text>
    <text x="105" y="194" text-anchor="middle" fill="#94a3b8" font-size="10">Temporary Authorized Access</text>

    <rect x="15" y="212" width="180" height="32" rx="6" fill="#064e3b" />
    <text x="105" y="232" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Docker Container (Alpine)</text>
  </g>

  <!-- 3. AI / LLM Serverless Layer -->
  <g transform="translate(540, 140)">
    <rect width="190" height="140" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" />
    <rect width="190" height="32" rx="12" fill="url(#purpleGrad)" />
    <text x="95" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">AI Intelligence Engine</text>
    
    <text x="95" y="60" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Dual-Engine Strategy</text>
    <text x="95" y="80" text-anchor="middle" fill="#f1f5f9" font-size="11">1. Google Gemini API</text>
    <text x="95" y="98" text-anchor="middle" fill="#94a3b8" font-size="10">Contextual Diet Generation</text>
    <text x="95" y="118" text-anchor="middle" fill="#38bdf8" font-size="11">2. Offline Fallback Logic</text>
    <text x="95" y="132" text-anchor="middle" fill="#94a3b8" font-size="9">BMR / TDEE Mathematical Engine</text>
  </g>

  <!-- 4. Cloud Database Tier -->
  <g transform="translate(770, 140)">
    <rect width="180" height="140" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
    <rect width="180" height="32" rx="12" fill="url(#blueGrad)" />
    <text x="90" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Managed Cloud Database</text>
    
    <circle cx="90" cy="62" r="16" fill="#1e3a8a" />
    <text x="90" y="67" text-anchor="middle" fill="#93c5fd" font-size="14">🗄️</text>
    <text x="90" y="94" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">PostgreSQL / Supabase</text>
    <text x="90" y="110" text-anchor="middle" fill="#94a3b8" font-size="10">Users • Profiles • Diet Plans</text>
    <text x="90" y="125" text-anchor="middle" fill="#64748b" font-size="9">(Dev: SQLite Local DB)</text>
  </g>

  <!-- 5. Cloud Object Storage Tier -->
  <g transform="translate(540, 320)">
    <rect width="410" height="170" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" />
    <rect width="410" height="32" rx="12" fill="url(#amberGrad)" />
    <text x="205" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Cloud Object Storage (S3 / GCS / Local Bucket)</text>
    
    <rect x="20" y="48" width="175" height="105" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="107" y="70" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Storage Abstraction Layer</text>
    <text x="107" y="88" text-anchor="middle" fill="#94a3b8" font-size="10">• Python Strategy Pattern</text>
    <text x="107" y="104" text-anchor="middle" fill="#94a3b8" font-size="10">• Path Traversal Sanitizer</text>
    <text x="107" y="120" text-anchor="middle" fill="#94a3b8" font-size="10">• Presigned URL Generation</text>
    <text x="107" y="136" text-anchor="middle" fill="#94a3b8" font-size="10">• Stream / Chunked Uploads</text>

    <rect x="215" y="48" width="175" height="105" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="302" y="70" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Multi-Tenant Key Hierarchy</text>
    <text x="302" y="88" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="monospace">bucket/</text>
    <text x="302" y="104" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="monospace">├── user_abc123/</text>
    <text x="302" y="120" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="monospace">│   ├── blood_report.pdf</text>
    <text x="302" y="136" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="monospace">│   └── meal_log.json</text>
  </g>

  <!-- Connectors -->
  <!-- Client <-> Backend -->
  <line x1="190" y1="290" x2="260" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="225" y="278" text-anchor="middle" fill="#94a3b8" font-size="9">HTTPS / JWT</text>

  <!-- Backend <-> AI Engine -->
  <line x1="470" y1="210" x2="540" y2="210" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Backend <-> Database -->
  <line x1="470" y1="180" x2="770" y2="180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)" />
  <text x="620" y="173" text-anchor="middle" fill="#93c5fd" font-size="9">SQLAlchemy ORM</text>

  <!-- Backend <-> Object Storage -->
  <line x1="470" y1="370" x2="540" y2="370" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="505" y="362" text-anchor="middle" fill="#fbbf24" font-size="9">IO Stream</text>

  <!-- Direct Presigned URL Access (Client direct to Storage) -->
  <path d="M 110 380 C 110 490, 480 490, 540 430" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)" />
  <text x="280" y="505" text-anchor="middle" fill="#94a3b8" font-size="10">Direct S3/Presigned Download</text>

</svg>
