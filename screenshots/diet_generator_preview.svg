            <text x="436" y="24" text-anchor="middle" fill="#059669" font-size="9.5" font-weight="700">480 kcal</text>
            <text x="38" y="44" fill="#64748b" font-size="10.5">Protein: 18g • Carbs: 68g • Fats: 12g</text>
            <text x="38" y="60" fill="#059669" font-size="9" font-weight="600">Tags: high-fiber, energizing, lacto-vegetarian</text>
