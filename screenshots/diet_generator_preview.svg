            <text x="14" y="24" font-size="16">🥗</text>
            <text x="38" y="23" fill="#0f172a" font-size="12" font-weight="700">Lunch: Quinoa Power Bowl with Spiced Tofu</text>
            <rect x="408" y="10" width="56" height="20" rx="4" fill="#ecfdf5" />
            <text x="436" y="24" text-anchor="middle" fill="#059669" font-size="9.5" font-weight="700">680 kcal</text>
            <text x="38" y="44" fill="#64748b" font-size="10.5">Protein: 32g • Carbs: 82g • Fats: 20g</text>
            <text x="38" y="60" fill="#059669" font-size="9" font-weight="600">Tags: high-protein, antioxidant, peanut-free</text>
