            <text x="436" y="24" text-anchor="middle" fill="#059669" font-size="9.5" font-weight="700">590 kcal</text>
            <text x="38" y="44" fill="#64748b" font-size="10.5">Protein: 24g • Carbs: 94g • Fats: 11g</text>
            <text x="38" y="60" fill="#059669" font-size="9" font-weight="600">Tags: plant-protein, light-dinner, digestive</text>
