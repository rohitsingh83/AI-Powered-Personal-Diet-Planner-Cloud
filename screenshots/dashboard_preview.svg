<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1000" height="60" fill="#ffffff" stroke="#e2e8f0" />
  <circle cx="45" cy="30" r="14" fill="#10b981" />
  <text x="45" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="900">🥗</text>
  <text x="70" y="36" fill="#0f172a" font-size="16" font-weight="700">NutriCloud <tspan fill="#10b981" font-weight="400">AI</tspan></text>
  
  <text x="500" y="35" fill="#0f172a" font-size="13" font-weight="600">Dashboard</text>
  <text x="600" y="35" fill="#64748b" font-size="13">Generate Plan</text>
  <text x="720" y="35" fill="#64748b" font-size="13">Cloud Storage Vault</text>
  <text x="880" y="35" fill="#0f172a" font-size="13" font-weight="600">👤 Demo User</text>

  <!-- Main Container -->
  <!-- Header Section -->
  <text x="60" y="110" fill="#0f172a" font-size="24" font-weight="800">Welcome back, Demo! 👋</text>
  <text x="60" y="132" fill="#64748b" font-size="13">Here is your cloud nutrition intelligence &amp; synchronized biometric data.</text>

  <rect x="730" y="95" width="120" height="36" rx="6" fill="#10b981" />
  <text x="790" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">+ Generate Plan</text>

  <rect x="860" y="95" width="80" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <text x="900" y="118" text-anchor="middle" fill="#334155" font-size="12" font-weight="500">Upload File</text>

  <!-- Metric Stat Cards (4 columns) -->
  <!-- Card 1 -->
  <g transform="translate(60, 160)">
    <rect width="205" height="90" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="16" y="28" fill="#059669" font-size="11" font-weight="700" letter-spacing="0.5">TOTAL PLANS GENERATED</text>
    <text x="16" y="65" fill="#065f46" font-size="28" font-weight="800">4</text>
    <text x="160" y="58" font-size="26">📋</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(285, 160)">
    <rect width="205" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="16" y="28" fill="#2563eb" font-size="11" font-weight="700" letter-spacing="0.5">FILES IN CLOUD VAULT</text>
    <text x="16" y="65" fill="#1e40af" font-size="28" font-weight="800">3</text>
    <text x="160" y="58" font-size="26">☁️</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(510, 160)">
    <rect width="205" height="90" rx="8" fill="#fff7ed" stroke="#fed7aa" />
    <text x="16" y="28" fill="#ea580c" font-size="11" font-weight="700" letter-spacing="0.5">CURRENT TARGET GOAL</text>
    <text x="16" y="65" fill="#9a3412" font-size="20" font-weight="800">Maintenance</text>
    <text x="160" y="58" font-size="26">🎯</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(735, 160)">
    <rect width="205" height="90" rx="8" fill="#faf5ff" stroke="#e9d5ff" />
    <text x="16" y="28" fill="#9333ea" font-size="11" font-weight="700" letter-spacing="0.5">DIETARY RESTRICTION</text>
    <text x="16" y="65" fill="#6b21a8" font-size="20" font-weight="800">Vegetarian</text>
    <text x="160" y="58" font-size="26">🥑</text>
  </g>

  <!-- Two Column Layout: Active Diet Plan & Cloud Storage Status -->
  <!-- Left Box: Active Plan -->
  <g transform="translate(60, 275)">
    <rect width="530" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)" />
    <text x="24" y="35" fill="#0f172a" font-size="16" font-weight="700">Active AI Diet Plan (Target: 2,150 kcal)</text>
    <rect x="420" y="18" width="90" height="24" rx="12" fill="#dcfce7" />
    <text x="465" y="34" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600">AI Synced</text>

    <!-- Macro Breakdown -->
    <rect x="24" y="55" width="150" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="36" y="75" fill="#64748b" font-size="10">PROTEIN</text>
    <text x="36" y="95" fill="#0f172a" font-size="14" font-weight="700">125g (25%)</text>

    <rect x="190" y="55" width="150" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="202" y="75" fill="#64748b" font-size="10">CARBS</text>
    <text x="202" y="95" fill="#0f172a" font-size="14" font-weight="700">268g (50%)</text>

    <rect x="356" y="55" width="150" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="368" y="75" fill="#64748b" font-size="10">FATS</text>
    <text x="368" y="95" fill="#0f172a" font-size="14" font-weight="700">60g (25%)</text>

    <!-- Meal Samples -->
    <text x="24" y="135" fill="#334155" font-size="12" font-weight="700">MEAL ITINERARY</text>
    
    <rect x="24" y="145" width="482" height="38" rx="6" fill="#f1f5f9" />
    <text x="36" y="168" fill="#0f172a" font-size="12" font-weight="600">🥣 Breakfast: Oatmeal with almond milk, chia seeds, banana (480 kcal)</text>

    <rect x="24" y="190" width="482" height="38" rx="6" fill="#f1f5f9" />
    <text x="36" y="213" fill="#0f172a" font-size="12" font-weight="600">🥗 Lunch: Quinoa bowl with spiced tofu, chickpeas &amp; spinach (680 kcal)</text>

    <rect x="24" y="235" width="482" height="38" rx="6" fill="#f1f5f9" />
    <text x="36" y="258" fill="#0f172a" font-size="12" font-weight="600">🍲 Dinner: Lentil dal curry with brown rice and steamed broccoli (590 kcal)</text>
  </g>

  <!-- Right Box: Cloud Object Vault -->
  <g transform="translate(615, 275)">
    <rect width="325" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)" />
    <text x="20" y="35" fill="#0f172a" font-size="15" font-weight="700">Cloud Storage Bucket Vault</text>
    <text x="20" y="52" fill="#64748b" font-size="11">Prefix: <tspan font-family="monospace">user_demo123/</tspan></text>

    <!-- File 1 -->
    <g transform="translate(20, 70)">
      <rect width="285" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="24" font-size="16">📄</text>
      <text x="36" y="23" fill="#0f172a" font-size="12" font-weight="600">blood_panel_2026.pdf</text>
      <text x="36" y="38" fill="#64748b" font-size="10">2.4 MB • Presigned URL Active</text>
      <rect x="225" y="14" width="50" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="250" y="29" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="600">GET</text>
    </g>

    <!-- File 2 -->
    <g transform="translate(20, 132)">
      <rect width="285" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="24" font-size="16">📊</text>
      <text x="36" y="23" fill="#0f172a" font-size="12" font-weight="600">nutrition_log_week1.json</text>
      <text x="36" y="38" fill="#64748b" font-size="10">48 KB • LocalStack/S3 Sync</text>
      <rect x="225" y="14" width="50" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="250" y="29" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="600">GET</text>
    </g>

    <!-- Cloud Info Banner -->
    <rect x="20" y="200" width="285" height="65" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="30" y="222" fill="#065f46" font-size="11" font-weight="700">🔒 Zero-Trust File Isolation</text>
    <text x="30" y="240" fill="#047857" font-size="10">Files isolated via tenant UID prefixes and</text>
    <text x="30" y="254" fill="#047857" font-size="10">time-limited presigned authentication tokens.</text>
  </g>
</svg>
