          <text x="44" y="36" text-anchor="middle" font-size="12">🥗</text>
          <text x="70" y="26" fill="#0f172a" font-size="12.5" font-weight="700">ai_diet_plan_maintenance.json</text>
          <text x="70" y="42" fill="#94a3b8" font-size="10.5">Gemini-generated 3-day meal itinerary JSON export</text>

          <text x="410" y="35" fill="#475569" font-size="11" font-family="monospace">user_demo123/g7h8_diet_plan.json</text>
          <text x="700" y="35" fill="#475569" font-size="11.5" font-weight="600">16 KB</text>
          
