          <circle cx="44" cy="31" r="14" fill="#eff6ff" />
          <text x="44" y="36" text-anchor="middle" font-size="12">📊</text>
          <text x="70" y="26" fill="#0f172a" font-size="12.5" font-weight="700">weekly_macros_tracking.json</text>
          <text x="70" y="42" fill="#94a3b8" font-size="10.5">Aggregated calorie, protein, carb, water logs export</text>

