          <text x="28" y="30" fill="#166534" font-size="11" font-weight="700">🔒 Multi-Tenant Zero-Trust Storage Isolation:</text>
          <text x="310" y="30" fill="#15803d" font-size="11">Every object is stored with tenant prefix `user_{id}/` and verified against JWT claims. Direct public access is blocked.</text>
