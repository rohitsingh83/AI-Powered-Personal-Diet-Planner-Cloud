          <circle cx="44" cy="31" r="14" fill="#faf5ff" />
          <text x="44" y="36" text-anchor="middle" font-size="12">🏥</text>
          <text x="70" y="26" fill="#0f172a" font-size="12.5" font-weight="700">dexa_scan_body_composition.pdf</text>
